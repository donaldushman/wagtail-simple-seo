name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            django: "Django>=5.2,<5.3"
            wagtail: "Wagtail>=7.2,<7.3"
          - python-version: "3.12"
            django: "Django>=5.2,<5.3"
            wagtail: "Wagtail>=8.0,<8.1"
          - python-version: "3.13"
            django: "Django>=5.2,<5.3"
            wagtail: "Wagtail>=8.0,<8.1"
          - python-version: "3.12"
            django: "Django>=6.0,<6.1"
            wagtail: "Wagtail>=8.0,<8.1"
          - python-version: "3.12"
            django: "Django==6.1.2"
            wagtail: "Wagtail>=8.0,<8.1"
          - python-version: "3.13"
            django: "Django>=6.1.2,<6.2"
            wagtail: "Wagtail>=8.0,<8.1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]" "${{ matrix.django }}" "${{ matrix.wagtail }}"
      - run: pytest
      - run: python -m django check --settings=tests.settings
