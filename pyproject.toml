[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-simple-seo"
version = "0.1.0"
description = "Lightweight SEO metadata and social sharing support for Wagtail."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.0",
    "Wagtail>=7.2,<9.0",
]
authors = [{ name = "Donald Ushman" }]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-django>=4.8",
]

[project.urls]
Repository = "https://github.com/donaldushman/wagtail-simple-seo"

[tool.setuptools.packages.find]
include = ["wagtail_simple_seo*"]

[tool.setuptools.package-data]
wagtail_simple_seo = ["templates/**/*.html"]
